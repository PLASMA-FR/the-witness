name: Deploy interactive demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "gallery/01_cover_the_witness.png"
      - "gallery/02_architecture_diagram.png"
      - "gallery/04_tui_dashboard.png"
      - "gallery/logo_witness_icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p site/assets
          cp gallery/01_cover_the_witness.png site/assets/cover.png
          cp gallery/02_architecture_diagram.png site/assets/architecture.png
          cp gallery/04_tui_dashboard.png site/assets/tui-dashboard.png
          cp gallery/logo_witness_icon.png site/assets/favicon.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
